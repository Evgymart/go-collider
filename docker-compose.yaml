version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/go/Dockerfile
    container_name: my-go-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M