services:
  app:
    build:
      context: .
      dockerfile: docker/go/Dockerfile
    container_name: collider-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
  test:
    build:
      context: .
      dockerfile: docker/go/Dockerfile
      target: builder
    container_name: collider-test
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: go test ./test/cases... -v
  db:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: collider-db
    environment:
      POSTGRES_DB: default
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DEV_DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d default" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: